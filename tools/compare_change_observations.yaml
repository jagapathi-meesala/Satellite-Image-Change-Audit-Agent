name: compare_change_observations
description: Compare supplied per-class areas and flag candidate changes above a threshold.
input_schema:
  type: object
  additionalProperties: false
  required: [pair]
  properties:
    pair:
      type: object
      additionalProperties: true
    min_area_delta_km2:
      type: number
      minimum: 0
      default: 0.1
